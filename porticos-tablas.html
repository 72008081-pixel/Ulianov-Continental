<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Matrices Académicas Oficiales — Pórticos 2D | Cátedra Ing. Ulianov Cuba Valencia</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;600;700&family=Inter:wght@400;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <style>
    :root {
      --bg-base: #060913;
      --bg-card: rgba(15, 23, 42, 0.85);
      --bg-card-subtle: rgba(30, 41, 59, 0.6);
      --border-subtle: rgba(56, 189, 248, 0.2);
      --border-muted: rgba(255, 255, 255, 0.08);
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --primary: #00f0ff;
      --accent-green: #10b981;
      --accent-yellow: #fde047;
      --accent-rose: #f43f5e;
      --pastel-sky: #e0f2fe;
      --pastel-mint: #dcfce7;
      --pastel-butter: #fef9c3;
      --font-mono: 'Fira Code', monospace;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background-color: var(--bg-base);
      color: var(--text-main);
      font-family: 'Inter', sans-serif;
      min-height: 100vh;
      padding-bottom: 60px;
    }

    header {
      background: rgba(10, 15, 30, 0.95);
      border-bottom: 1px solid var(--border-subtle);
      padding: 16px 28px;
      position: sticky;
      top: 0;
      z-index: 50;
      backdrop-filter: blur(12px);
    }

    .header-content {
      max-width: 1560px;
      margin: 0 auto;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 12px;
    }

    .header-title h1 {
      font-size: 16px;
      font-weight: 800;
      color: #ffffff;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .header-title p {
      font-size: 11px;
      color: var(--text-muted);
    }

    .header-actions {
      display: flex;
      gap: 10px;
      align-items: center;
      flex-wrap: wrap;
    }

    .btn {
      padding: 8px 16px;
      border-radius: 8px;
      font-weight: 800;
      font-size: 12px;
      cursor: pointer;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      border: 1.5px solid transparent;
      transition: all 0.2s;
    }

    .btn-portal {
      background: var(--pastel-sky);
      color: #0369a1;
      border-color: #7dd3fc;
    }

    .btn-excel {
      background: var(--pastel-mint);
      color: #064e3b;
      border-color: #6ee7b7;
    }

    .btn-print {
      background: var(--pastel-butter);
      color: #78350f;
      border-color: #fde047;
    }

    .btn:hover {
      transform: translateY(-1px);
      filter: brightness(1.08);
    }

    main {
      max-width: 1560px;
      margin: 24px auto;
      padding: 0 20px;
      display: flex;
      flex-direction: column;
      gap: 24px;
    }

    .card {
      background: var(--bg-card);
      border: 1px solid var(--border-subtle);
      border-radius: 12px;
      padding: 20px;
      overflow-x: auto;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
    }

    .card-title {
      font-size: 14px;
      font-weight: 800;
      color: #00f0ff;
      margin-bottom: 12px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid var(--border-subtle);
      padding-bottom: 8px;
    }

    .card-title-left {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    table.excel-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 11px;
      font-family: var(--font-mono);
      white-space: nowrap;
      text-align: right;
    }

    table.excel-table th {
      background: #1e293b;
      color: #38bdf8;
      padding: 7px 10px;
      border: 1px solid var(--border-muted);
      font-weight: 700;
      text-align: center;
    }

    table.excel-table td {
      padding: 6px 10px;
      border: 1px solid #1e293b;
      color: #f8fafc;
    }

    table.excel-table tr:hover td {
      background: rgba(56, 189, 248, 0.08);
    }

    .cell-center { text-align: center !important; }
    .cell-left { text-align: left !important; }
    .cell-diag { background: rgba(0, 255, 136, 0.15) !important; color: #00ff88 !important; font-weight: 800; }
    .cell-header-gdl { background: #0f1c34 !important; color: #00f0ff !important; font-weight: 800; text-align: center; }
    .cell-zero { color: #475569 !important; }
    .cell-restr { background: rgba(244, 63, 94, 0.12) !important; color: #f43f5e !important; text-decoration: line-through; }
    .cell-highlight { background: rgba(254, 240, 138, 0.15) !important; color: #fde047 !important; font-weight: 800; }

    .tag-badge {
      padding: 2px 8px;
      border-radius: 4px;
      font-size: 10.5px;
      font-weight: 800;
      display: inline-block;
    }
    .tag-fixed { background: rgba(0, 240, 255, 0.15); color: #00f0ff; border: 1px solid #00f0ff; }
    .tag-free { background: rgba(148, 163, 184, 0.15); color: #94a3b8; border: 1px solid #94a3b8; }
    .tag-pin { background: rgba(16, 185, 129, 0.15); color: #34d399; border: 1px solid #10b981; }

    .selector-pills {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
    }
    .pill-btn {
      background: #1e293b;
      color: #94a3b8;
      border: 1px solid var(--border-muted);
      border-radius: 6px;
      padding: 4px 10px;
      font-size: 11px;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.2s;
    }
    .pill-btn.active, .pill-btn:hover {
      background: var(--primary);
      color: #04101e;
      border-color: var(--primary);
      box-shadow: 0 0 10px rgba(0, 240, 255, 0.4);
    }

    .cuadros-grid {
      display: grid;
      grid-template-columns: 240px 1fr 240px;
      gap: 16px;
      align-items: start;
    }
    @media (max-width: 1200px) {
      .cuadros-grid { grid-template-columns: 1fr; }
    }

    .cuadro-box {
      background: rgba(10, 20, 38, 0.8);
      border: 1px solid var(--border-subtle);
      border-radius: 10px;
      padding: 14px;
      overflow-x: auto;
    }
    .cuadro-title {
      font-size: 12px;
      font-weight: 800;
      margin-bottom: 8px;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .status-ok {
      background: rgba(16, 185, 129, 0.15);
      border: 1px solid #10b981;
      color: #34d399;
      padding: 12px 16px;
      border-radius: 8px;
      font-weight: 800;
      font-size: 13px;
      display: flex;
      align-items: center;
      gap: 10px;
      margin-top: 10px;
    }

    @media print {
      header, .header-actions { display: none !important; }
      body { background: #ffffff; color: #000000; padding: 0; }
      .card { border: 1px solid #ccc; box-shadow: none; page-break-inside: avoid; }
      table.excel-table td, table.excel-table th { color: #000 !important; border: 1px solid #999 !important; }
    }
  </style>
</head>
<body>

  <header>
    <div class="header-content">
      <div class="header-title">
        <h1><i class="fa-solid fa-calculator" style="color:var(--primary);"></i> Matrices Académicas de Rigidez — Pórticos 2D (v4.0)</h1>
        <p>Cátedra Análisis Estructural II · Universidad Continental · Ing. Ulianov Cuba Valencia · Sistema de 33 GDL</p>
      </div>
      <div class="header-actions">
        <a href="porticos.html" class="btn btn-portal"><i class="fa-solid fa-arrow-left"></i> Volver al Solucionador</a>
        <button id="btnDownloadExcel" class="btn btn-excel"><i class="fa-solid fa-file-excel"></i> Descargar Excel Oficial (3.1 MIXTAS + PLANTILLA ULIANOV)</button>
        <button onclick="window.print()" class="btn btn-print"><i class="fa-solid fa-print"></i> Imprimir Memoria</button>
        <button type="button" id="cb-header-btn" class="btn" style="background: rgba(15, 23, 42, 0.85); color: #00f0ff; border: 1.5px solid #00f0ff; border-radius: 8px; font-weight: 800; display: inline-flex; align-items: center; gap: 6px;" title="Panel de control maestro del desarrollador (Ing. Ulianov Cuba)">👑 Panel Admin</button>
      </div>
    </div>
  </header>

  <main id="mainContainer">
    <!-- Contenido generado dinámicamente -->
  </main>

  <script src="assets/exceljs.min.js"></script>
  <script src="auth.js?v=8.1"></script>
  <script src="frame-solver.js"></script>
  <script src="frame-excel-generator.js"></script>

  <script>
    (function(){
      'use strict';
      const $ = id => document.getElementById(id);

      // Modelo por defecto (Ejercicio Maestro de 6 Nudos y 5 Tramos)
      const defaultModel = {
        E: 2100000,
        section: { shape: 'rect', b: 5, h: 5 },
        nodes: [
          { id: 1, x: 0, y: 0, support: 'fixed' },
          { id: 2, x: 0, y: 400, support: 'free' },
          { id: 3, x: 300, y: 400, support: 'free', fy: -7000 },
          { id: 4, x: 400, y: 400, support: 'free' },
          { id: 5, x: 400, y: 150, support: 'free', mz: -100000 },
          { id: 6, x: 400, y: 0, support: 'fixed' }
        ],
        bars: [
          { from: 1, to: 2, q0: 4, q1: 4, dir: 'globalX' },
          { from: 2, to: 3 },
          { from: 3, to: 4 },
          { from: 4, to: 5 },
          { from: 5, to: 6 }
        ]
      };

      let model = defaultModel;
      try {
        const stored = localStorage.getItem('porticos_current_model');
        if(stored) model = JSON.parse(stored);
      } catch(e){}

      let result = null;
      try {
        result = FrameSolver.compute(model);
      } catch(err){
        $('mainContainer').innerHTML = `<div style="color:#f87171; padding:20px; font-weight:bold;">Error resolviendo pórtico: ${err.message}</div>`;
        return;
      }

      function fmt(val, dec = 4){
        if(!Number.isFinite(val)) return '—';
        return val.toLocaleString('es-PE', { minimumFractionDigits: dec, maximumFractionDigits: dec });
      }

      let selectedExpandedBar = 1;

      function renderTables(){
        let html = '';

        // TABLA 1: PROPIEDADES DE SECCIÓN
        const p = result.props;
        html += `
        <div class="card">
          <div class="card-title">
            <div class="card-title-left"><i class="fa-solid fa-shapes"></i> 1. Propiedades del Material y Sección Transversal (10 Tramos)</div>
          </div>
          <table class="excel-table">
            <thead>
              <tr>
                <th class="cell-center">Parámetro</th>
                <th class="cell-center">Símbolo</th>
                <th class="cell-center">Valor</th>
                <th class="cell-center">Unidades</th>
                <th class="cell-left">Fórmula Oficial de Cátedra</th>
              </tr>
            </thead>
            <tbody>
              <tr><td class="cell-left">Módulo de Elasticidad</td><td class="cell-center">E</td><td>${fmt(result.E, 0)}</td><td class="cell-center">kgf/cm²</td><td class="cell-left">Dato de laboratorio / Cátedra</td></tr>
              <tr><td class="cell-left">Base</td><td class="cell-center">b</td><td>${fmt(model.section.b, 2)}</td><td class="cell-center">cm</td><td class="cell-left">Dimensión transversal</td></tr>
              <tr><td class="cell-left">Altura</td><td class="cell-center">h</td><td>${fmt(model.section.h, 2)}</td><td class="cell-center">cm</td><td class="cell-left">Dimensión transversal</td></tr>
              <tr><td class="cell-left">Área Transversal</td><td class="cell-center">A</td><td>${fmt(p.A, 2)}</td><td class="cell-center">cm²</td><td class="cell-left">A = b · h</td></tr>
              <tr><td class="cell-left">Momento de Inercia</td><td class="cell-center">I</td><td>${fmt(p.I, 4)}</td><td class="cell-center">cm⁴</td><td class="cell-left">I = (b · h³) / 12</td></tr>
              <tr><td class="cell-left">Rigidez Axial</td><td class="cell-center">EA</td><td>${fmt(result.E * p.A, 0)}</td><td class="cell-center">kgf</td><td class="cell-left">E · A</td></tr>
              <tr><td class="cell-left">Rigidez a la Flexión</td><td class="cell-center">EI</td><td>${fmt(result.E * p.I, 0)}</td><td class="cell-center">kgf·cm²</td><td class="cell-left">E · I</td></tr>
            </tbody>
          </table>
        </div>
        `;

        // TABLA 2: GEOMETRÍA DE TRAMOS
        html += `
        <div class="card">
          <div class="card-title">
            <div class="card-title-left"><i class="fa-solid fa-ruler-combined"></i> 2. Geometría de Tramos y Orientación de Barras</div>
          </div>
          <table class="excel-table">
            <thead>
              <tr>
                <th class="cell-center">Barra</th>
                <th class="cell-center">Ni</th>
                <th class="cell-center">Nj</th>
                <th>Xi (cm)</th><th>Yi (cm)</th><th>Xf (cm)</th><th>Yf (cm)</th>
                <th>L (cm)</th><th>L (m)</th><th>Ángulo θ (°)</th><th>cos θ</th><th>sen θ</th>
              </tr>
            </thead>
            <tbody>
              ${result.bars.map(b => {
                const n1 = result.nodes.find(n => n.id === b.n1);
                const n2 = result.nodes.find(n => n.id === b.n2);
                return `
                <tr>
                  <td class="cell-center" style="font-weight:bold; color:#00f0ff;">[${b.id}]</td>
                  <td class="cell-center">(${b.n1})</td>
                  <td class="cell-center">(${b.n2})</td>
                  <td>${fmt(n1.x, 1)}</td><td>${fmt(n1.y, 1)}</td>
                  <td>${fmt(n2.x, 1)}</td><td>${fmt(n2.y, 1)}</td>
                  <td style="font-weight:bold; color:#a7f3d0;">${fmt(b.L, 1)}</td>
                  <td>${fmt(b.L / 100, 2)}</td>
                  <td>${fmt(b.angleDeg, 2)}°</td>
                  <td>${fmt(b.c, 4)}</td>
                  <td>${fmt(b.s, 4)}</td>
                </tr>
                `;
              }).join('')}
            </tbody>
          </table>
        </div>
        `;

        // TABLA 3: EVALUACIÓN NODAL
        html += `
        <div class="card">
          <div class="card-title">
            <div class="card-title-left"><i class="fa-solid fa-list-check"></i> 3. Tabla de Evaluación Nodal, Grados de Libertad y Cargas</div>
          </div>
          <table class="excel-table">
            <thead>
              <tr>
                <th class="cell-center">Nudo</th>
                <th>X (cm)</th><th>Y (cm)</th>
                <th class="cell-center">Apoyo</th>
                <th class="cell-center">GDL Ux</th><th class="cell-center">GDL Uy</th><th class="cell-center">GDL θz</th>
                <th>Fx (kgf)</th><th>Fy (kgf)</th><th>Mz (kgf·cm)</th>
              </tr>
            </thead>
            <tbody>
              ${result.nodes.map(n => `
                <tr>
                  <td class="cell-center" style="font-weight:bold; color:#10b981;">(${n.id})</td>
                  <td>${fmt(n.x, 1)}</td><td>${fmt(n.y, 1)}</td>
                  <td class="cell-center"><span class="tag-badge ${n.support==='fixed'?'tag-fixed':n.support==='free'?'tag-free':'tag-pin'}">${({'fixed':'EMPOTRADO','pin':'ARTICULADO','rollerY':'RODILLO Y','rollerX':'RODILLO X','free':'LIBRE'}[n.support]||n.support.toUpperCase())}</span></td>
                  <td class="cell-center" style="color:${(n.support==='fixed'||n.support==='pin'||n.support==='rollerX')?'#f43f5e':'#34d399'}; font-weight:bold;">${(n.support==='fixed'||n.support==='pin'||n.support==='rollerX')?'RESTRINGIDO':'LIBRE'}</td>
                  <td class="cell-center" style="color:${(n.support==='fixed'||n.support==='pin'||n.support==='rollerY')?'#f43f5e':'#34d399'}; font-weight:bold;">${(n.support==='fixed'||n.support==='pin'||n.support==='rollerY')?'RESTRINGIDO':'LIBRE'}</td>
                  <td class="cell-center" style="color:${(n.support==='fixed')?'#f43f5e':'#34d399'}; font-weight:bold;">${(n.support==='fixed')?'RESTRINGIDO':'LIBRE'}</td>
                  <td style="color:#fde047;">${fmt(n.fx, 2)}</td>
                  <td style="color:#fde047;">${fmt(n.fy, 2)}</td>
                  <td style="color:#f43f5e;">${fmt(n.mz, 2)}</td>
                </tr>
              `).join('')}
            </tbody>
          </table>
        </div>
        `;

        // TABLA 4: MATRICES LOCALES Y GLOBALES 6x6 POR BARRA
        html += `
        <div class="card">
          <div class="card-title">
            <div class="card-title-left"><i class="fa-solid fa-cube"></i> 4. Matrices Elementales 6x6 (Local [k] y Transformada [kt] = [T]^T [k] [T])</div>
          </div>
          <div style="display:flex; flex-direction:column; gap:20px;">
            ${result.bars.map(b => `
              <div style="border:1px solid rgba(255,255,255,0.06); border-radius:8px; padding:12px; background:rgba(0,0,0,0.2);">
                <div style="color:#00f0ff; font-weight:bold; margin-bottom:10px;">Barra [${b.id}]: Nudo (${b.n1}) → Nudo (${b.n2}) · L = ${fmt(b.L, 1)} cm · θ = ${fmt(b.angleDeg, 1)}°</div>
                <div style="display:grid; grid-template-columns: 1fr 1fr; gap:16px;">
                  <div>
                    <p style="color:#38bdf8; font-size:11px; font-weight:bold; margin-bottom:6px;">Matriz Local [k] (6x6) [kgf, cm]:</p>
                    <table class="excel-table">
                      <tbody>
                        ${b.k.map((row, r) => `<tr>${row.map((val, c) => `<td class="${r===c?'cell-diag':(Math.abs(val)<1e-6?'cell-zero':'')}">${fmt(val, 2)}</td>`).join('')}</tr>`).join('')}
                      </tbody>
                    </table>
                  </div>
                  <div>
                    <p style="color:#34d399; font-size:11px; font-weight:bold; margin-bottom:6px;">Matriz Global [kt] = [T]^T [k] [T] (6x6):</p>
                    <table class="excel-table">
                      <tbody>
                        ${b.kt.map((row, r) => `<tr>${row.map((val, c) => `<td class="${r===c?'cell-diag':(Math.abs(val)<1e-6?'cell-zero':'')}">${fmt(val, 2)}</td>`).join('')}</tr>`).join('')}
                      </tbody>
                    </table>
                  </div>
                </div>
              </div>
            `).join('')}
          </div>
        </div>
        `;

        // TABLA 5: MATRICES EXPANDIDAS 33x33 (Satisface exigencia de considerar todas las variables horizontal y verticalmente)
        html += `
        <div class="card">
          <div class="card-title">
            <div class="card-title-left"><i class="fa-solid fa-table-cells-large"></i> 5. Matriz Expandida 33 x 33 de la Barra (Consideración Completa Horizontal y Vertical)</div>
            <div class="selector-pills">
              ${result.bars.map(b => `<button class="pill-btn ${b.id === selectedExpandedBar ? 'active' : ''}" onclick="window.setExpBar(${b.id})">Barra [${b.id}]</button>`).join('')}
            </div>
          </div>
          <p style="font-size:11px; color:#94a3b8; margin-bottom:10px;">
            Muestra la matriz elemental de 6x6 mapeada dentro del espacio vectorial total de 33 Grados de Libertad (11 Nudos x 3 GDL).
          </p>
          <div style="max-height: 480px; overflow: auto; border: 1px solid var(--border-muted); border-radius: 6px;">
            <table class="excel-table">
              <thead>
                <tr>
                  <th class="cell-center" style="position:sticky; left:0; z-index:2; background:#0f172a;">GDL</th>
                  ${result.dofLabels33.map(l => `<th>${l}</th>`).join('')}
                </tr>
              </thead>
              <tbody>
                ${(()=>{
                  const curExp = result.expandedBars33.find(eb => eb.barId === selectedExpandedBar) || result.expandedBars33[0];
                  return curExp.matrix.map((row, r) => `
                    <tr>
                      <td class="cell-center cell-header-gdl" style="position:sticky; left:0; background:#0f172a;">${result.dofLabels33[r]}</td>
                      ${row.map((val, c) => {
                        const isNonZero = Math.abs(val) > 1e-4;
                        const isDiag = (r === c && isNonZero);
                        return `<td class="${isDiag?'cell-diag':(isNonZero?'cell-highlight':'cell-zero')}">${isNonZero ? fmt(val, 2) : '0'}</td>`;
                      }).join('')}
                    </tr>
                  `).join('');
                })()}
              </tbody>
            </table>
          </div>
        </div>
        `;

        // TABLA 6: MATRIZ DE RIGIDEZ GLOBAL DE LA ESTRUCTURA [K] (ENSAMBLE COMPLETO 33x33)
        html += `
        <div class="card">
          <div class="card-title">
            <div class="card-title-left"><i class="fa-solid fa-network-wired"></i> 6. Matriz de Rigidez Global de la Estructura [K] (Ensamble Total 33 x 33 GDL)</div>
          </div>
          <p style="font-size:11px; color:#94a3b8; margin-bottom:10px;">
            Suma directa en la misma posición de todas las matrices globales expandidas: [K] = Σ [K_expandida_i].
          </p>
          <div style="max-height: 480px; overflow: auto; border: 1px solid var(--border-muted); border-radius: 6px;">
            <table class="excel-table">
              <thead>
                <tr>
                  <th class="cell-center" style="position:sticky; left:0; z-index:2; background:#0f172a;">GDL</th>
                  ${result.dofLabels33.map(l => `<th>${l}</th>`).join('')}
                </tr>
              </thead>
              <tbody>
                ${result.K_global_33.map((row, r) => `
                  <tr>
                    <td class="cell-center cell-header-gdl" style="position:sticky; left:0; background:#0f172a;">${result.dofLabels33[r]}</td>
                    ${row.map((val, c) => {
                      const isNonZero = Math.abs(val) > 1e-4;
                      const isDiag = (r === c && isNonZero);
                      const isZeroDiag = (r === c && !isNonZero);
                      let cls = 'cell-zero';
                      if(isDiag) cls = 'cell-diag';
                      else if(isNonZero) cls = 'cell-highlight';
                      else if(isZeroDiag) cls = 'cell-zero';
                      return `<td class="${cls}">${isNonZero ? fmt(val, 2) : '0'}</td>`;
                    }).join('')}
                  </tr>
                `).join('')}
              </tbody>
            </table>
          </div>
        </div>
        `;


        // TABLA 6B: MATRICES / VECTORES INDIVIDUALES DE CARGAS {P} Y DESPLAZAMIENTOS {D} (SISTEMA TOTAL 33 GDL)
        html += `
        <div class="card">
          <div class="card-title">
            <div class="card-title-left"><i class="fa-solid fa-list-ol"></i> 6B. Matriz Individual de Cargas Globales {P} y Matriz de Desplazamientos {D} (33 GDL)</div>
          </div>
          <p style="font-size:11px; color:#94a3b8; margin-bottom:12px;">
            Desglose completo individual grado por grado (11 Nudos × 3 GDL = 33 Filas). Muestra en qué nodos hay cargas aplicadas (positivas o negativas por fuerzas o momentos) y los desplazamientos o condiciones de frontera de cada grado.
          </p>
          <div style="display:grid; grid-template-columns: 1fr 1fr; gap:16px;">
            
            <!-- Matriz / Vector de Cargas {P} -->
            <div style="border: 1px solid var(--border-subtle); border-radius: 8px; padding: 14px; background: rgba(10, 20, 38, 0.6);">
              <div style="font-weight: 800; font-size: 13px; color: #38bdf8; margin-bottom: 8px; display: flex; align-items: center; gap: 6px;">
                <i class="fa-solid fa-weight-hanging"></i> Matriz Individual de Cargas Globales {P} (33 × 1)
              </div>
              <p style="font-size: 10.5px; color: #94a3b8; margin-bottom: 8px;">
                Cargas nodales directas + cargas nodales equivalentes de tramos:
              </p>
              <div style="max-height: 440px; overflow-y: auto;">
                <table class="excel-table">
                  <thead>
                    <tr>
                      <th class="cell-center">GDL</th>
                      <th class="cell-center">Nudo</th>
                      <th class="cell-center">Comp.</th>
                      <th>Carga {P}</th>
                      <th class="cell-center">Unidad</th>
                      <th class="cell-center">Identificación de Carga</th>
                    </tr>
                  </thead>
                  <tbody>
                    ${result.F_applied_33.map((fVal, g) => {
                      const nId = Math.floor(g / 3) + 1;
                      const comp = ['Fx', 'Fy', 'Mz'][g % 3];
                      const unit = comp === 'Mz' ? 'kgf·cm' : 'kgf';
                      const hasLoad = Math.abs(fVal) > 1e-4;
                      return `
                      <tr>
                        <td class="cell-center cell-header-gdl">${result.dofLabels33[g]}</td>
                        <td class="cell-center" style="font-weight:bold; color:#00f0ff;">Nudo ${nId}</td>
                        <td class="cell-center" style="font-weight:bold; color:${comp==='Mz'?'#f43f5e':'#38bdf8'};">${comp}</td>
                        <td style="font-weight:bold; color:${hasLoad ? (fVal < 0 ? '#f43f5e' : '#34d399') : '#64748b'};">${hasLoad ? fmt(fVal, 2) : '0.00'}</td>
                        <td class="cell-center" style="color:#94a3b8;">${unit}</td>
                        <td class="cell-center">
                          <span class="tag-badge ${hasLoad ? (fVal < 0 ? 'tag-fixed' : 'tag-pin') : 'tag-free'}">
                            ${hasLoad ? (fVal < 0 ? 'MENOS ' + (comp === 'Mz' ? 'MOMENTO' : 'CARGA') : 'MÁS ' + (comp === 'Mz' ? 'MOMENTO' : 'CARGA')) : 'SIN CARGA (0)'}
                          </span>
                        </td>
                      </tr>
                      `;
                    }).join('')}
                  </tbody>
                </table>
              </div>
            </div>

            <!-- Matriz / Vector de Desplazamientos {D} -->
            <div style="border: 1px solid var(--border-subtle); border-radius: 8px; padding: 14px; background: rgba(10, 20, 38, 0.6);">
              <div style="font-weight: 800; font-size: 13px; color: #10b981; margin-bottom: 8px; display: flex; align-items: center; gap: 6px;">
                <i class="fa-solid fa-arrows-up-down-left-right"></i> Matriz Individual de Desplazamientos {D} (33 × 1)
              </div>
              <p style="font-size: 10.5px; color: #94a3b8; margin-bottom: 8px;">
                Desplazamientos lineales (cm) y giros angulares (rad) en los 33 GDL:
              </p>
              <div style="max-height: 440px; overflow-y: auto;">
                <table class="excel-table">
                  <thead>
                    <tr>
                      <th class="cell-center">GDL</th>
                      <th class="cell-center">Nudo</th>
                      <th class="cell-center">Comp.</th>
                      <th>Desplazamiento {D}</th>
                      <th class="cell-center">Unidad</th>
                      <th class="cell-center">Condición</th>
                    </tr>
                  </thead>
                  <tbody>
                    ${result.D_total_33.map((dVal, g) => {
                      const nId = Math.floor(g / 3) + 1;
                      const comp = ['Ux', 'Uy', 'θz'][g % 3];
                      const unit = comp === 'θz' ? 'rad' : 'cm';
                      const isRestricted = result.dofConditions_33[g] === 'RESTRINGIDO';
                      const isNonZero = Math.abs(dVal) > 1e-9;
                      return `
                      <tr>
                        <td class="cell-center cell-header-gdl">${result.dofLabels33[g]}</td>
                        <td class="cell-center" style="font-weight:bold; color:#00f0ff;">Nudo ${nId}</td>
                        <td class="cell-center" style="font-weight:bold; color:${comp==='θz'?'#fde047':'#10b981'};">${comp}</td>
                        <td style="font-weight:bold; color:${isRestricted ? '#f43f5e' : (isNonZero ? '#a7f3d0' : '#64748b')};">${isRestricted ? '0.000000 (Apoyo)' : (isNonZero ? fmt(dVal, 6) : '0.000000')}</td>
                        <td class="cell-center" style="color:#94a3b8;">${unit}</td>
                        <td class="cell-center">
                          <span class="tag-badge ${isRestricted ? 'tag-fixed' : 'tag-free'}">
                            ${isRestricted ? 'RESTRINGIDO' : 'LIBRE'}
                          </span>
                        </td>
                      </tr>
                      `;
                    }).join('')}
                  </tbody>
                </table>
              </div>
            </div>

          </div>
        </div>
        `;

        // TABLA 7: PARTICIÓN MATRICIAL (ELIMINACIÓN DE APOYOS) Y SUBMATRIZ LIBRE [K_LL]
        const freeCount = result.free.length;
        html += `
        <div class="card">
          <div class="card-title">
            <div class="card-title-left"><i class="fa-solid fa-scissors"></i> 7. Partición Matricial: Submatriz Reducida de Grados Libres [K_LL] (${freeCount} x ${freeCount})</div>
          </div>
          <p style="font-size:11px; color:#94a3b8; margin-bottom:10px;">
            Eliminación de las filas y columnas restringidas por empotramientos/apoyos fijos (desplazamientos nulos D=0). Se obtiene el bloque central activo.
          </p>
          <div style="overflow-x: auto;">
            <table class="excel-table">
              <thead>
                <tr>
                  <th class="cell-center">GDL Libre</th>
                  ${result.free.map(dIdx => `<th>${result.dofLabels33[dIdx]}</th>`).join('')}
                </tr>
              </thead>
              <tbody>
                ${result.Kff.map((row, r) => `
                  <tr>
                    <td class="cell-center cell-header-gdl">${result.dofLabels33[result.free[r]]}</td>
                    ${row.map((val, c) => `<td class="${r===c?'cell-diag':''}">${fmt(val, 2)}</td>`).join('')}
                  </tr>
                `).join('')}
              </tbody>
            </table>
          </div>
        </div>
        `;

        // TABLA 8: MATRIZ INVERSA [K_LL]^-1
        html += `
        <div class="card">
          <div class="card-title">
            <div class="card-title-left"><i class="fa-solid fa-arrows-spin"></i> 8. Matriz Inversa [K_LL]^-1 (Inversión Matricial con =MINVERSA, ${freeCount} x ${freeCount})</div>
          </div>
          <p style="font-size:11px; color:#94a3b8; margin-bottom:10px;">
            Cálculo numérico de alta precisión mediante eliminación de Gauss-Jordan con pivoteo parcial / Excel MINVERSA.
          </p>
          <div style="overflow-x: auto;">
            <table class="excel-table">
              <thead>
                <tr>
                  <th class="cell-center">GDL</th>
                  ${result.free.map(dIdx => `<th>${result.dofLabels33[dIdx]}</th>`).join('')}
                </tr>
              </thead>
              <tbody>
                ${result.Kff_inv.map((row, r) => `
                  <tr>
                    <td class="cell-center cell-header-gdl">${result.dofLabels33[result.free[r]]}</td>
                    ${row.map(val => `<td style="color:#fde047;">${val.toExponential(6)}</td>`).join('')}
                  </tr>
                `).join('')}
              </tbody>
            </table>
          </div>
        </div>
        `;

        // TABLA 9: LOS 3 CUADROS CLÁSICOS DE RESOLUCIÓN MATRICIAL: {D_L} = [K_LL]^-1 * {F_L}
        html += `
        <div class="card">
          <div class="card-title">
            <div class="card-title-left"><i class="fa-solid fa-equals"></i> 9. Ecuación Matricial Fundamental: {D_libres} = [K_LL]^-1 · {F_libres} (Los 3 Cuadros Clásicos)</div>
          </div>
          <div class="cuadros-grid">
            <!-- Cuadro 1: Desplazamientos -->
            <div class="cuadro-box" style="border-color:#10b981;">
              <div class="cuadro-title" style="color:#34d399;"><i class="fa-solid fa-arrow-up-right-dots"></i> CUADRO 1: {D_libres}</div>
              <table class="excel-table">
                <thead><tr><th class="cell-center">GDL</th><th>Valor</th><th>Unidad</th></tr></thead>
                <tbody>
                  ${result.Df_inv.map((val, i) => `
                    <tr>
                      <td class="cell-center cell-header-gdl">${result.dofLabels33[result.free[i]]}</td>
                      <td style="color:#34d399; font-weight:bold;">${fmt(val, 6)}</td>
                      <td class="cell-center" style="color:#94a3b8;">${result.free[i]%3===2?'rad':'cm'}</td>
                    </tr>
                  `).join('')}
                </tbody>
              </table>
            </div>

            <!-- Cuadro 2: Matriz Inversa resumida -->
            <div class="cuadro-box" style="border-color:#fde047;">
              <div class="cuadro-title" style="color:#fde047;"><i class="fa-solid fa-table"></i> CUADRO 2: [K_LL]^-1 (${freeCount}x${freeCount})</div>
              <div style="overflow-x:auto;">
                <table class="excel-table">
                  <thead>
                    <tr>
                      ${result.free.map(dIdx => `<th>${result.dofLabels33[dIdx]}</th>`).join('')}
                    </tr>
                  </thead>
                  <tbody>
                    ${result.Kff_inv.map((row, r) => `
                      <tr>
                        ${row.map(val => `<td style="font-size:10px;">${val.toExponential(4)}</td>`).join('')}
                      </tr>
                    `).join('')}
                  </tbody>
                </table>
              </div>
            </div>

            <!-- Cuadro 3: Cargas libres -->
            <div class="cuadro-box" style="border-color:#38bdf8;">
              <div class="cuadro-title" style="color:#38bdf8;"><i class="fa-solid fa-weight-hanging"></i> CUADRO 3: {F_libres}</div>
              <table class="excel-table">
                <thead><tr><th class="cell-center">GDL</th><th>Fuerza</th><th>Unidad</th></tr></thead>
                <tbody>
                  ${result.Ff.map((val, i) => `
                    <tr>
                      <td class="cell-center cell-header-gdl">${result.dofLabels33[result.free[i]]}</td>
                      <td style="color:#38bdf8; font-weight:bold;">${fmt(val, 2)}</td>
                      <td class="cell-center" style="color:#94a3b8;">${result.free[i]%3===2?'kgf·cm':'kgf'}</td>
                    </tr>
                  `).join('')}
                </tbody>
              </table>
            </div>
          </div>
        </div>
        `;

        // TABLA 10: CÁLCULO DE REACCIONES MEDIANTE FILAS RESTRINGIDAS [K_RL]
        html += `
        <div class="card">
          <div class="card-title">
            <div class="card-title-left"><i class="fa-solid fa-anchor"></i> 10. Cálculo de Reacciones: {R} = [K_RL] · {D_libres} - {F_restringidos}</div>
          </div>
          <p style="font-size:11px; color:#94a3b8; margin-bottom:10px;">
            Multiplicación de las filas retenidas de la matriz de rigidez donde D=0 por el vector de desplazamientos libres resuelto.
          </p>
          <table class="excel-table">
            <thead>
              <tr>
                <th class="cell-center">GDL Reacción</th>
                <th class="cell-center">Símbolo</th>
                <th class="cell-left">Fórmula Aplicada</th>
                <th>Valor Numérico</th>
                <th class="cell-center">Unidad</th>
                <th class="cell-center">Condición</th>
              </tr>
            </thead>
            <tbody>
              ${result.restrained.map((dIdx, r) => {
                const nIdx = Math.floor(dIdx / 3) + 1;
                const dofType = ['X', 'Y', 'θ'][dIdx % 3];
                const rVal = result.R_partition[r];
                return `
                <tr>
                  <td class="cell-center cell-header-gdl">${result.dofLabels33[dIdx]}</td>
                  <td class="cell-center" style="font-weight:bold; color:#00f0ff;">R${nIdx}${dofType}</td>
                  <td class="cell-left" style="color:#94a3b8;">K_RL(${r+1}, :) · {D_L} - F_R(${r+1})</td>
                  <td style="font-weight:bold; color:#bae6fd;">${fmt(rVal, 2)}</td>
                  <td class="cell-center">${dofType==='θ'?'kgf·cm':'kgf'}</td>
                  <td class="cell-center"><span class="tag-badge tag-fixed">RESTRINGIDO</span></td>
                </tr>
                `;
              }).join('')}
            </tbody>
          </table>
        </div>
        `;

        // TABLA 11: TABLA DE DATOS PARA GRAFICAR LA CURVA ELÁSTICA (2 COLUMNAS EXACTAS)
        html += `
        <div class="card">
          <div class="card-title">
            <div class="card-title-left"><i class="fa-solid fa-chart-line"></i> 11. Datos para Graficar la Curva Elástica (Tabla de 2 Columnas Solicitada)</div>
          </div>
          <p style="font-size:11px; color:#94a3b8; margin-bottom:10px;">
            Tabla compacta de 2 columnas para generación directa y manual del gráfico de elástica (Coordenada X vs Deflexión Vertical DY).
          </p>
          <div style="max-width: 420px;">
            <table class="excel-table">
              <thead>
                <tr>
                  <th class="cell-center">Nudo</th>
                  <th class="cell-center" style="background:#0284c7; color:#fff;">X (cm)</th>
                  <th class="cell-center" style="background:#10b981; color:#fff;">DY (cm)</th>
                </tr>
              </thead>
              <tbody>
                ${result.elastic_curve_2col.map(pt => `
                  <tr>
                    <td class="cell-center" style="font-weight:bold; color:#00f0ff;">(${pt.nodeId})</td>
                    <td style="font-weight:bold;">${fmt(pt.x, 2)}</td>
                    <td style="font-weight:bold; color:#34d399;">${fmt(pt.dy, 6)}</td>
                  </tr>
                `).join('')}
              </tbody>
            </table>
          </div>
        </div>
        `;

        // TABLA 12: RESUMEN EJECUTIVO Y COMPROBACIÓN ESTÁTICA GLOBAL
        html += `
        <div class="card">
          <div class="card-title">
            <div class="card-title-left"><i class="fa-solid fa-scale-balanced"></i> 12. Resumen Ejecutivo de Reacciones y Comprobación Estática Global</div>
          </div>
          <table class="excel-table">
            <thead>
              <tr>
                <th class="cell-center">Nudo</th>
                <th class="cell-center">Apoyo</th>
                <th>Ux (cm)</th><th>Uy (cm)</th><th>Giro θz (rad)</th>
                <th>Rx (kgf)</th><th>Ry (kgf)</th><th>RM (kgf·cm)</th>
              </tr>
            </thead>
            <tbody>
              ${result.nodes.map(n => `
                <tr>
                  <td class="cell-center" style="font-weight:bold; color:#00f0ff;">(${n.id})</td>
                  <td class="cell-center">${n.support.toUpperCase()}</td>
                  <td style="font-weight:bold; color:#a7f3d0;">${fmt(n.ux, 6)}</td>
                  <td style="font-weight:bold; color:#bae6fd;">${fmt(n.uy, 6)}</td>
                  <td style="color:#fde047;">${fmt(n.theta, 8)}</td>
                  <td style="color:${Math.abs(n.rx)>1e-4?'#38bdf8':'#64748b'}; font-weight:bold;">${fmt(n.rx, 2)}</td>
                  <td style="color:${Math.abs(n.ry)>1e-4?'#38bdf8':'#64748b'}; font-weight:bold;">${fmt(n.ry, 2)}</td>
                  <td style="color:${Math.abs(n.rm)>1e-4?'#f43f5e':'#64748b'}; font-weight:bold;">${fmt(n.rm, 2)}</td>
                </tr>
              `).join('')}
            </tbody>
          </table>

          <div class="status-ok">
            <i class="fa-solid fa-circle-check"></i> ESTRUCTURA EN EQUILIBRIO GLOBAL ESTÁTICO: 
            ΣFx = ${fmt(result.equilibrium.fx, 8)} kgf · 
            ΣFy = ${fmt(result.equilibrium.fy, 8)} kgf · 
            ΣMz = ${fmt(result.equilibrium.mz, 6)} kgf·cm
          </div>
        </div>
        `;

        $('mainContainer').innerHTML = html;
      }

      window.setExpBar = function(barId){
        selectedExpandedBar = barId;
        renderTables();
      };

      renderTables();

      $('btnDownloadExcel').addEventListener('click', async () => {
        const btn = $('btnDownloadExcel');
        const origText = btn.innerHTML;
        btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Generando Excel Oficial...';
        try {
          await FrameExcelGenerator.downloadFrameExcel(model, result, 'PLANTILLA_ULIANOV_PORTICOS_2D_OFICIAL.xlsx');
        } catch(err){
          alert('Error generando Excel: ' + err.message);
        } finally {
          btn.innerHTML = origText;
        }
      });

    })();
  </script>
</body>
</html>
